<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Conversas WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
<style>
:root{--accent:#7443F5;--accent2:#A88BFF;--muted:#AEA9C5}
*{box-sizing:border-box}
body{margin:0;background:#05040C;color:#F1EEFB;font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(ellipse 900px 700px at 20% -10%,rgba(116,67,245,.28),transparent 65%)}
.wrap{max-width:1240px;margin:0 auto;padding:40px 56px 96px}
.pill{display:inline-flex;border:1px solid rgba(168,139,255,.5);background:rgba(116,67,245,.12);color:var(--accent2);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;border-radius:8px}
h1{margin:24px 0 0;font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-.04em;line-height:1;text-shadow:0 4px 24px rgba(116,67,245,.28),0 0 60px rgba(116,67,245,.16)}
.sub{margin:14px 0 0;color:var(--muted);font-size:16px;line-height:1.7;max-width:640px}
.nav{display:flex;gap:10px;margin-top:24px}
.nav a{display:inline-flex;align-items:center;min-height:42px;padding:0 16px;border-radius:9px;border:1px solid rgba(124,84,245,.4);color:#D2CEE6;font-size:13px;font-weight:600;text-decoration:none}
.nav a.on{background:rgba(116,67,245,.35);border-color:#8B63FF;color:#fff}
.board{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;margin-top:28px;align-items:start}
.search{width:100%;height:46px;padding:0 16px;border-radius:10px;border:1px solid rgba(124,84,245,.4);background:rgba(8,6,20,.7);color:#F1EEFB;font-family:inherit;font-size:14px;margin-bottom:12px}
.search::placeholder{color:#8F8AA8}
button{font-family:inherit;cursor:pointer}
.convos{display:flex;flex-direction:column;gap:8px;max-height:74vh;overflow:auto}
.convo{text-align:left;border:1px solid rgba(124,84,245,.4);background:rgba(20,12,46,.55);border-radius:14px;padding:14px 16px;width:100%}
.convo:hover{border-color:#8B63FF}
.convo.on{border-color:#A88BFF;background:rgba(116,67,245,.22)}
.convo .p{font-weight:600;font-size:14px;color:#F1EEFB}
.convo .n{color:var(--muted);font-size:12px;margin-top:2px}
.convo .m{margin-top:8px;font-size:13px;color:#D2CEE6;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo .t{margin-top:6px;font-size:11px;color:#8F8AA8}
.thread{border:1px solid rgba(124,84,245,.4);background:rgba(20,12,46,.4);border-radius:18px;padding:22px;min-height:74vh;max-height:74vh;display:flex;flex-direction:column}
.thread h2{margin:0 0 4px;font-size:18px}
.thread .ph{color:var(--muted);font-size:13px;margin-bottom:18px}
.msgs{display:flex;flex-direction:column;gap:10px;overflow:auto;flex:1}
.bubble{max-width:76%;padding:11px 15px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .ts{display:block;margin-top:5px;font-size:10.5px;opacity:.65}
.in{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:4px}
.out{align-self:flex-end;background:rgba(116,67,245,.35);border:1px solid rgba(139,99,255,.5);border-bottom-right-radius:4px}
.empty{margin:auto;color:var(--muted);text-align:center;line-height:1.7;padding:24px}
@media(max-width:1100px){.wrap{padding-left:40px;padding-right:40px}}
@media(max-width:860px){.board{grid-template-columns:1fr}.convos{max-height:280px}.thread{min-height:60vh;max-height:60vh}}
@media(max-width:560px){.wrap{padding:28px 20px 72px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="pill">Área administrativa</div>
  <h1>Conversas do WhatsApp</h1>
  <p class="sub">Tudo que o Drigo conversa pelo número da Máquina de Decisões aparece aqui, só pra leitura. Atualiza sozinho a cada 15s.</p>
  <div class="nav">
    <a href="/admin">Inscrições</a>
    <a href="/admin/whatsapp" class="on">Conversas WhatsApp</a>
  </div>

  <div class="board">
    <div>
      <input id="q" class="search" type="search" placeholder="Buscar por nome ou número" aria-label="Buscar conversas">
      <div class="convos" id="convos" aria-live="polite"></div>
    </div>
    <div class="thread" id="thread"><div class="empty">Selecione uma conversa pra ler.</div></div>
  </div>
</div>

<script>
(function () {
  var convos = [], q = '', current = null;
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text; // textContent: nunca interpreta HTML
    return e;
  }

  function api(url) {
    return fetch(url, { credentials: 'same-origin' }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }

  function fmt(d) {
    return new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function loadConvos() {
    return api('/admin/api/whatsapp/conversations').then(function (rows) {
      convos = rows;
      renderConvos();
      if (current) loadThread(current, true);
    }).catch(function () {
      var c = $('convos'); c.textContent = '';
      c.appendChild(el('div', 'empty', 'Não foi possível carregar as conversas.'));
    });
  }

  function renderConvos() {
    var t = q.trim().toLowerCase();
    var list = $('convos'); list.textContent = '';
    var rows = convos.filter(function (c) {
      if (!t) return true;
      return [c.profile_name, c.phone].join(' ').toLowerCase().indexOf(t) !== -1;
    });
    if (!rows.length) {
      list.appendChild(el('div', 'empty', convos.length ? 'Nenhuma conversa encontrada.' : 'Nenhuma conversa ainda. Quando alguém escrever pro número, aparece aqui.'));
      return;
    }
    rows.forEach(function (c) {
      var b = el('button', 'convo' + (current === c.phone ? ' on' : ''));
      b.appendChild(el('div', 'p', c.profile_name || c.phone));
      if (c.profile_name) b.appendChild(el('div', 'n', c.phone));
      var prefix = c.last_direction === 'out' ? 'Drigo: ' : '';
      b.appendChild(el('div', 'm', prefix + c.last_body));
      b.appendChild(el('div', 't', fmt(c.last_at) + ' · ' + c.count + (c.count == 1 ? ' mensagem' : ' mensagens')));
      b.onclick = function () { current = c.phone; renderConvos(); loadThread(c.phone); };
      list.appendChild(b);
    });
  }

  function loadThread(phone, silent) {
    return api('/admin/api/whatsapp/conversations/' + encodeURIComponent(phone)).then(function (rows) {
      var box = $('thread'); box.textContent = '';
      var meta = convos.filter(function (c) { return c.phone === phone; })[0];
      box.appendChild(el('h2', null, (meta && meta.profile_name) || phone));
      box.appendChild(el('div', 'ph', phone));
      var msgs = el('div', 'msgs');
      rows.forEach(function (m) {
        var bub = el('div', 'bubble ' + (m.direction === 'out' ? 'out' : 'in'), m.body);
        bub.appendChild(el('span', 'ts', fmt(m.created_at)));
        msgs.appendChild(bub);
      });
      box.appendChild(msgs);
      msgs.scrollTop = msgs.scrollHeight;
    }).catch(function () {
      if (silent) return;
      var box = $('thread'); box.textContent = '';
      box.appendChild(el('div', 'empty', 'Não foi possível carregar essa conversa.'));
    });
  }

  $('q').addEventListener('input', function (e) { q = e.target.value; renderConvos(); });
  loadConvos();
  setInterval(loadConvos, 15000);
})();
</script>
</body>
</html>
